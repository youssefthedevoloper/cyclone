name: Android APK  cyclone

on:
  push:
    branches:
      - "**"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: "stable"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      # Build ONE normal universal APK (all ABIs). It installs on every
      # Android device with no user-side choices. Only the base ML Kit
      # text-recognition (Latin) module is bundled — the unused language
      # modules were removed so the universal APK fits under 50MB, and native
      # libs are stored compressed (useLegacyPackaging) to shrink it further.
      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
